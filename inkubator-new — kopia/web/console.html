<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konsola · Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0c0e;
            font-family: 'Courier New', 'IBM Plex Mono', monospace;
            font-size: 16px;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .instrument {
            width: 100%;
            max-width: 760px;
            background: #0c0e12;
            border: 1px solid #1e2228;
            border-radius: 8px;
            padding: 18px 22px 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1e24;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #ccdce8;
            text-transform: uppercase;
        }
        .header-title span {
            color: #5a6a7a;
        }
        .header-status {
            font-size: 12px;
            color: #5a6a7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a3240;
            transition: background 0.4s ease;
        }
        .header-status .dot.online {
            background: #30c060;
            box-shadow: 0 0 10px rgba(48, 192, 96, 0.4);
        }
        .header-status .dot.offline {
            background: #e05050;
            box-shadow: 0 0 10px rgba(224, 80, 80, 0.4);
        }

        #console {
            width: 100%;
            height: 320px;
            overflow-y: scroll;
            background: #0a0c0e;
            border: 1px solid #1a1e24;
            border-radius: 4px;
            padding: 10px 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #70d070;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #console::-webkit-scrollbar {
            width: 4px;
        }
        #console::-webkit-scrollbar-track {
            background: transparent;
        }
        #console::-webkit-scrollbar-thumb {
            background: #2a3240;
            border-radius: 2px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .input-row input[type="text"] {
            flex: 1;
            min-width: 140px;
            background: #161d24;
            border: 1px solid #2d3744;
            border-radius: 4px;
            color: #e6eef8;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .input-row input[type="text"]:focus {
            border-color: #5a8a7a;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn {
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid #2a3240;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #8a9aa8;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier New', monospace;
            flex: 1 1 auto;
            min-width: 90px;
            text-align: center;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #b0c8d8;
            border-color: #3a4250;
        }
        .btn-primary {
            border-color: #3a6a5a;
            color: #5a9a8a;
        }
        .btn-primary:hover {
            background: rgba(57, 211, 95, 0.08);
            border-color: #5a8a7a;
            color: #70d070;
        }
        .btn-danger {
            border-color: #6a3a3a;
            color: #c06060;
        }
        .btn-danger:hover {
            background: rgba(224, 80, 80, 0.08);
            border-color: #8a4a4a;
            color: #e06060;
        }
        .btn-back {
            border-color: #1a1e24;
            color: #4a525a;
        }
        .btn-back:hover {
            border-color: #3a4250;
            color: #6a7a8a;
        }
        .btn-full {
            flex: 1 1 100%;
        }

        .status-bar {
            margin-top: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #5a6a7a;
            background: rgba(20, 24, 32, 0.4);
            border: 1px solid #1a1e24;
            min-height: 34px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-bar .msg {
            flex: 1;
        }
        .status-bar .msg.ok {
            color: #70d070;
        }
        .status-bar .msg.err {
            color: #e05050;
        }
        .status-bar .msg.info {
            color: #5a9a8a;
        }

        .user-message {
            color: #b0d0ff;
        }
        .system-message {
            color: #70d070;
        }
        .error-message {
            color: #e05050;
        }

        @media (max-width: 600px) {
            .instrument {
                padding: 12px 14px;
            }
            .header-title {
                font-size: 14px;
            }
            #console {
                height: 220px;
                font-size: 12px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 14px;
                min-width: 70px;
            }
        }
        @media (max-width: 400px) {
            .instrument {
                padding: 8px 10px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .input-row {
                flex-direction: column;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <div class="header">
            <div class="header-title"><span>⌨️</span> Konsola · <span id="pageTitle">Terminal</span></div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <div id="console">--- Konsola gotowa ---</div>

        <div class="input-row">
            <input type="text" id="cmdInput" placeholder="Wpisz komendę..." />
            <button class="btn btn-primary" id="sendBtn">Wyślij</button>
            <button class="btn btn-danger" id="clearBtn">Wyczyść</button>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
        </div>

        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span style="font-size:10px;color:#2a3240;" id="wsDetail"></span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const WS_URL = 'ws://' + location.host + ':81/';
            let ws = null,
                wsConnected = false,
                reconnectTimer = null,
                reconnectAttempts = 0;
            const MAX_RECONNECT_ATTEMPTS = 10;

            const consoleDiv = document.getElementById('console');
            const cmdInput = document.getElementById('cmdInput');
            const statusMsg = document.getElementById('statusMsg');
            const wsDot = document.getElementById('wsDot');
            const wsStatus = document.getElementById('wsStatus');
            const wsDetail = document.getElementById('wsDetail');

            function setStatus(text, type) {
                statusMsg.textContent = text;
                statusMsg.className = 'msg' + (type ? ' ' + type : '');
            }

            function setWsStatus(connected) {
                wsConnected = connected;
                wsDot.className = 'dot' + (connected ? ' online' : ' offline');
                wsStatus.textContent = connected ? 'Połączono' : 'Rozłączono';
                wsDetail.textContent = connected ? 'WebSocket OK' : 'próba ' + reconnectAttempts;
            }

            function wsSend(cmd) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(cmd);
                    return true;
                }
                setStatus('Brak połączenia z ESP', 'err');
                return false;
            }

            function wsConnect() {
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
                try {
                    ws = new WebSocket(WS_URL);
                    ws.onopen = function() {
                        reconnectAttempts = 0;
                        setWsStatus(true);
                        setStatus('Połączono', 'ok');
                        displayMessage('--- Połączono z ESP ---', 'system-message');
                        wsSend('carregarIdioma');
                    };
                    ws.onmessage = function(event) {
                        var msg = event.data;
                        if (msg.startsWith('idiomaAtual:')) return;
                        displayMessage(msg, 'system-message');
                    };
                    ws.onclose = function() {
                        setWsStatus(false);
                        setStatus('Rozłączono, ponowna próba...', 'err');
                        displayMessage('--- Rozłączono ---', 'error-message');
                        scheduleReconnect();
                    };
                    ws.onerror = function(err) {
                        console.warn('WebSocket error:', err);
                        setStatus('Błąd WebSocket', 'err');
                        displayMessage('Błąd WebSocket: ' + err, 'error-message');
                        if (ws) ws.close();
                    };
                } catch (e) {
                    console.warn('WebSocket init error:', e);
                    setStatus('Nie można utworzyć połączenia', 'err');
                    scheduleReconnect();
                }
            }

            function scheduleReconnect() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts++;
                if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
                    setStatus('Brak połączenia – spróbuj ponownie ręcznie', 'err');
                    return;
                }
                const delay = Math.min(5000, 1000 * Math.pow(1.5, reconnectAttempts));
                reconnectTimer = setTimeout(wsConnect, delay);
            }

            function displayMessage(msg, className) {
                var timestamp = new Date().toLocaleTimeString();
                var line = document.createElement('div');
                line.className = className || 'system-message';
                line.textContent = '[' + timestamp + '] ' + msg;
                consoleDiv.appendChild(line);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
                while (consoleDiv.children.length > 200) {
                    consoleDiv.removeChild(consoleDiv.firstChild);
                }
            }

            function sendCommand() {
                var cmd = cmdInput.value.trim();
                if (!cmd) return;
                displayMessage('> ' + cmd, 'user-message');
                wsSend(cmd);
                cmdInput.value = '';
                cmdInput.focus();
            }

            function clearConsole() {
                consoleDiv.innerHTML = '';
                displayMessage('--- Konsola wyczyszczona ---', 'system-message');
            }

            function goBack() { window.location.href = '/'; }

            function reconnectManually() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts = 0;
                if (ws) { try { ws.close(); } catch (e) {} }
                ws = null;
                setStatus('Łączenie...', 'info');
                wsConnect();
            }

            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('sendBtn').addEventListener('click', sendCommand);
                document.getElementById('clearBtn').addEventListener('click', clearConsole);
                document.getElementById('backBtn').addEventListener('click', goBack);
                cmdInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') sendCommand();
                });
                wsStatus.addEventListener('click', reconnectManually);
                wsDot.addEventListener('click', reconnectManually);
                wsConnect();
                setInterval(function() {
                    if (!wsConnected) reconnectManually();
                }, 30000);
            });

            window.addEventListener('beforeunload', function() {
                if (ws) { try { ws.close(); } catch (e) {} }
                if (reconnectTimer) clearTimeout(reconnectTimer);
            });
        })();
    </script>

</body>
</html>
