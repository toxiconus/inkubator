; =============================================
; platformio.ini - Inkubator Mini
; =============================================

[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include
data_dir = data
lib_dir = lib
test_dir = test

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200
upload_protocol = esptool
upload_port = COM7
monitor_port = COM7
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    milesburton/DallasTemperature@^3.9.1
    bblanchon/ArduinoJson@^7.2.0
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit BMP085 Library@^1.2.2
    adafruit/Adafruit Unified Sensor@^1.1.15
    OneWire
    rfetick/MPU6050_light

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_RUNNING_CORE=1
    -D EEPROM_SIZE=512
    -D MAX_TRAYS=3
    -D MAX_SENSORS=4
    -D MAX_DIFFUSERS=3
    -D HISTORY_SIZE=300
    -D CONFIG_VERSION=107
    -D CONFIG_LWIP_IP_FORWARD=1
    -D CONFIG_LWIP_IPV4_NAPT=1
    -D CONFIG_LWIP_L2_TO_L3_COPY=1
    -Os
    -fno-exceptions
    -fno-rtti

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
board_build.filesystem = littlefs

; =============================================
; Drobne ulepszenia (opcjonalne)
; Jeśli chcesz mieć jeszcze większą stabilność, możesz dodać:
;   -DCORE_DEBUG_LEVEL=5
;   -DARDUINO_USB_CDC_ON_BOOT=0   ; Wyłącza USB CDC (zapobiega konfliktom z GPIO19/20)
; =============================================

; Aby włączyć te opcje, odkomentuj poniższy blok i ustaw odpowiednio.
; build_flags =
;     -DCORE_DEBUG_LEVEL=5
;     -DARDUINO_USB_CDC_ON_BOOT=0
