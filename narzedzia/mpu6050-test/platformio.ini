[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM9
lib_deps =
    jrowberg/I2Cdevlib-MPU6050@^1.0.0
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_RUNNING_CORE=1
    -Os
    -fno-exceptions
    -fno-rtti
