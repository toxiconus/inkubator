<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustawienia · Alarmy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0c0e;
            font-family: 'Courier New', 'IBM Plex Mono', monospace;
            font-size: 16px;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .instrument {
            width: 100%;
            max-width: 620px;
            background: #0c0e12;
            border: 1px solid #1e2228;
            border-radius: 8px;
            padding: 18px 22px 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1e24;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #ccdce8;
            text-transform: uppercase;
        }
        .header-title span {
            color: #5a6a7a;
        }
        .header-status {
            font-size: 12px;
            color: #5a6a7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a3240;
            transition: background 0.4s ease;
        }
        .header-status .dot.online {
            background: #30c060;
            box-shadow: 0 0 10px rgba(48, 192, 96, 0.4);
        }
        .header-status .dot.offline {
            background: #e05050;
            box-shadow: 0 0 10px rgba(224, 80, 80, 0.4);
        }

        .alarm-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(26, 30, 36, 0.4);
        }
        .alarm-group label {
            font-size: 13px;
            color: #8a9aa8;
            cursor: pointer;
            font-weight: 500;
        }
        .alarm-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #5a8a7a;
            cursor: pointer;
            background: #161d24;
            border: 1px solid #2d3744;
            border-radius: 3px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .btn {
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid #2a3240;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #8a9aa8;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier New', monospace;
            flex: 1 1 auto;
            min-width: 90px;
            text-align: center;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #b0c8d8;
            border-color: #3a4250;
        }
        .btn-primary {
            border-color: #3a6a5a;
            color: #5a9a8a;
        }
        .btn-primary:hover {
            background: rgba(57, 211, 95, 0.08);
            border-color: #5a8a7a;
            color: #70d070;
        }
        .btn-back {
            border-color: #1a1e24;
            color: #4a525a;
        }
        .btn-back:hover {
            border-color: #3a4250;
            color: #6a7a8a;
        }
        .btn-full {
            flex: 1 1 100%;
        }

        .status-bar {
            margin-top: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #5a6a7a;
            background: rgba(20, 24, 32, 0.4);
            border: 1px solid #1a1e24;
            min-height: 34px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-bar .msg {
            flex: 1;
        }
        .status-bar .msg.ok {
            color: #70d070;
        }
        .status-bar .msg.err {
            color: #e05050;
        }
        .status-bar .msg.info {
            color: #5a9a8a;
        }

        @media (max-width: 600px) {
            .instrument {
                padding: 12px 14px;
            }
            .header-title {
                font-size: 14px;
            }
            .alarm-group label {
                font-size: 12px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 14px;
                min-width: 70px;
            }
        }
        @media (max-width: 400px) {
            .instrument {
                padding: 8px 10px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <div class="header">
            <div class="header-title"><span>🔔</span> Ustawienia · <span id="pageTitle">Alarmy</span></div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <form id="configForm">
            <div id="alarmList">
                <div class="alarm-group">
                    <label for="alarm0">Temperatura wysoka</label>
                    <input type="checkbox" id="alarm0" />
                </div>
                <div class="alarm-group">
                    <label for="alarm1">Temperatura niska</label>
                    <input type="checkbox" id="alarm1" />
                </div>
                <div class="alarm-group">
                    <label for="alarm2">Wilgotność wysoka</label>
                    <input type="checkbox" id="alarm2" />
                </div>
                <div class="alarm-group">
                    <label for="alarm3">Wilgotność niska</label>
                    <input type="checkbox" id="alarm3" />
                </div>
                <div class="alarm-group">
                    <label for="alarm4">Awaria grzałki</label>
                    <input type="checkbox" id="alarm4" />
                </div>
                <div class="alarm-group">
                    <label for="alarm5">Awaria pompy</label>
                    <input type="checkbox" id="alarm5" />
                </div>
                <div class="alarm-group">
                    <label for="alarm6">Niski poziom wody</label>
                    <input type="checkbox" id="alarm6" />
                </div>
                <div class="alarm-group">
                    <label for="alarm7">Brak Wi-Fi</label>
                    <input type="checkbox" id="alarm7" />
                </div>
                <div class="alarm-group">
                    <label for="alarm8">Błąd NTP</label>
                    <input type="checkbox" id="alarm8" />
                </div>
                <div class="alarm-group">
                    <label for="alarm9">Błąd czujnika</label>
                    <input type="checkbox" id="alarm9" />
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="saveBtn">Zapisz alarmy</button>
                <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
            </div>
        </form>

        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span style="font-size:10px;color:#2a3240;" id="wsDetail"></span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const WS_URL = 'ws://' + location.host + ':81/';
            const ALARM_COUNT = 10;
            let ws = null,
                wsConnected = false,
                reconnectTimer = null,
                reconnectAttempts = 0;
            const MAX_RECONNECT_ATTEMPTS = 10;

            const statusMsg = document.getElementById('statusMsg');
            const wsDot = document.getElementById('wsDot');
            const wsStatus = document.getElementById('wsStatus');
            const wsDetail = document.getElementById('wsDetail');

            function setStatus(text, type) {
                statusMsg.textContent = text;
                statusMsg.className = 'msg' + (type ? ' ' + type : '');
            }

            function setWsStatus(connected) {
                wsConnected = connected;
                wsDot.className = 'dot' + (connected ? ' online' : ' offline');
                wsStatus.textContent = connected ? 'Połączono' : 'Rozłączono';
                wsDetail.textContent = connected ? 'WebSocket OK' : 'próba ' + reconnectAttempts;
            }

            function wsSend(cmd) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(cmd);
                    return true;
                }
                setStatus('Brak połączenia z ESP', 'err');
                return false;
            }

            function wsConnect() {
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
                try {
                    ws = new WebSocket(WS_URL);
                    ws.onopen = function() {
                        reconnectAttempts = 0;
                        setWsStatus(true);
                        setStatus('Pobieram stan alarmów...', 'info');
                        wsSend('carregarAlarmes');
                        wsSend('carregarIdioma');
                    };
                    ws.onmessage = function(event) {
                        var msg = event.data;
                        if (msg.startsWith('idiomaAtual:')) return;
                        if (msg.startsWith('statusAlarmes:')) {
                            var data = msg.substring(14).split(',');
                            for (var i = 0; i < ALARM_COUNT && i < data.length; i++) {
                                var cb = document.getElementById('alarm' + i);
                                if (cb) cb.checked = (parseInt(data[i]) === 1);
                            }
                            setStatus('Stan alarmów wczytany', 'ok');
                        }
                    };
                    ws.onclose = function() {
                        setWsStatus(false);
                        setStatus('Rozłączono, ponowna próba...', 'err');
                        scheduleReconnect();
                    };
                    ws.onerror = function(err) {
                        console.warn('WebSocket error:', err);
                        setStatus('Błąd WebSocket', 'err');
                        if (ws) ws.close();
                    };
                } catch (e) {
                    console.warn('WebSocket init error:', e);
                    setStatus('Nie można utworzyć połączenia', 'err');
                    scheduleReconnect();
                }
            }

            function scheduleReconnect() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts++;
                if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
                    setStatus('Brak połączenia – spróbuj ponownie ręcznie', 'err');
                    return;
                }
                const delay = Math.min(5000, 1000 * Math.pow(1.5, reconnectAttempts));
                reconnectTimer = setTimeout(wsConnect, delay);
            }

            function saveAlarms() {
                var states = [];
                for (var i = 0; i < ALARM_COUNT; i++) {
                    var cb = document.getElementById('alarm' + i);
                    states.push(cb ? (cb.checked ? 1 : 0) : 0);
                }
                var msg = 'salvarAlarmes:' + states.join(',');
                if (wsSend(msg)) setStatus('Wysłano ustawienia alarmów', 'ok');
            }

            function goBack() { window.location.href = '/'; }

            function reconnectManually() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts = 0;
                if (ws) { try { ws.close(); } catch (e) {} }
                ws = null;
                setStatus('Łączenie...', 'info');
                wsConnect();
            }

            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('saveBtn').addEventListener('click', saveAlarms);
                document.getElementById('backBtn').addEventListener('click', goBack);
                wsStatus.addEventListener('click', reconnectManually);
                wsDot.addEventListener('click', reconnectManually);
                wsConnect();
                setInterval(function() {
                    if (!wsConnected) reconnectManually();
                }, 30000);
            });

            window.addEventListener('beforeunload', function() {
                if (ws) { try { ws.close(); } catch (e) {} }
                if (reconnectTimer) clearTimeout(reconnectTimer);
            });
        })();
    </script>

</body>
</html>
