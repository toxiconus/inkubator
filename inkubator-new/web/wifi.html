<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustawienia · Wi-Fi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0c0e;
            font-family: 'Courier New', 'IBM Plex Mono', monospace;
            font-size: 16px;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .instrument {
            width: 100%;
            max-width: 620px;
            background: #0c0e12;
            border: 1px solid #1e2228;
            border-radius: 8px;
            padding: 18px 22px 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1e24;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #ccdce8;
            text-transform: uppercase;
        }
        .header-title span {
            color: #5a6a7a;
        }
        .header-status {
            font-size: 12px;
            color: #5a6a7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a3240;
            transition: background 0.4s ease;
        }
        .header-status .dot.online {
            background: #30c060;
            box-shadow: 0 0 10px rgba(48, 192, 96, 0.4);
        }
        .header-status .dot.offline {
            background: #e05050;
            box-shadow: 0 0 10px rgba(224, 80, 80, 0.4);
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8a9aa8;
            display: block;
            margin-bottom: 4px;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            background: #161d24;
            border: 1px solid #2d3744;
            border-radius: 4px;
            color: #e6eef8;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus {
            border-color: #5a8a7a;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #5a6a7a;
            padding: 6px 0;
            border-top: 1px solid #1a1e24;
            margin-top: 8px;
        }
        .status-line .val {
            color: #8a9aa8;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .btn {
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid #2a3240;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #8a9aa8;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier New', monospace;
            flex: 1 1 auto;
            min-width: 90px;
            text-align: center;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #b0c8d8;
            border-color: #3a4250;
        }
        .btn-primary {
            border-color: #3a6a5a;
            color: #5a9a8a;
        }
        .btn-primary:hover {
            background: rgba(57, 211, 95, 0.08);
            border-color: #5a8a7a;
            color: #70d070;
        }
        .btn-danger {
            border-color: #6a3a3a;
            color: #c06060;
        }
        .btn-danger:hover {
            background: rgba(224, 80, 80, 0.08);
            border-color: #8a4a4a;
            color: #e06060;
        }
        .btn-back {
            border-color: #1a1e24;
            color: #4a525a;
        }
        .btn-back:hover {
            border-color: #3a4250;
            color: #6a7a8a;
        }
        .btn-full {
            flex: 1 1 100%;
        }

        .status-bar {
            margin-top: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #5a6a7a;
            background: rgba(20, 24, 32, 0.4);
            border: 1px solid #1a1e24;
            min-height: 34px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-bar .msg {
            flex: 1;
        }
        .status-bar .msg.ok {
            color: #70d070;
        }
        .status-bar .msg.err {
            color: #e05050;
        }
        .status-bar .msg.info {
            color: #5a9a8a;
        }

        @media (max-width: 600px) {
            .instrument {
                padding: 12px 14px;
            }
            .header-title {
                font-size: 14px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 14px;
                min-width: 70px;
            }
        }
        @media (max-width: 400px) {
            .instrument {
                padding: 8px 10px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <div class="header">
            <div class="header-title"><span>📶</span> Ustawienia · <span id="pageTitle">Wi-Fi</span></div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <form id="configForm">
            <div class="form-group">
                <span class="label">Nazwa sieci (SSID)</span>
                <input type="text" id="ssid" placeholder="np. MojaSieć" />
            </div>
            <div class="form-group">
                <span class="label">Hasło (minimum 8 znaków)</span>
                <input type="password" id="password" placeholder="********" />
            </div>

            <div class="status-line">
                <span>Status połączenia</span>
                <span class="val" id="wifiStatus">Nieznany</span>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="saveBtn">Zapisz sieć</button>
                <button type="button" class="btn btn-danger" id="removeBtn">Usuń sieć</button>
                <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
            </div>
        </form>

        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span style="font-size:10px;color:#2a3240;" id="wsDetail"></span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const WS_URL = 'ws://' + location.host + ':81/';
            let ws = null,
                wsConnected = false,
                reconnectTimer = null,
                reconnectAttempts = 0;
            const MAX_RECONNECT_ATTEMPTS = 10;

            const statusMsg = document.getElementById('statusMsg');
            const wsDot = document.getElementById('wsDot');
            const wsStatus = document.getElementById('wsStatus');
            const wsDetail = document.getElementById('wsDetail');
            const wifiStatus = document.getElementById('wifiStatus');
            const ssidInput = document.getElementById('ssid');
            const passInput = document.getElementById('password');

            function setStatus(text, type) {
                statusMsg.textContent = text;
                statusMsg.className = 'msg' + (type ? ' ' + type : '');
            }

            function setWsStatus(connected) {
                wsConnected = connected;
                wsDot.className = 'dot' + (connected ? ' online' : ' offline');
                wsStatus.textContent = connected ? 'Połączono' : 'Rozłączono';
                wsDetail.textContent = connected ? 'WebSocket OK' : 'próba ' + reconnectAttempts;
            }

            function wsSend(cmd) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(cmd);
                    return true;
                }
                setStatus('Brak połączenia z ESP', 'err');
                return false;
            }

            function wsConnect() {
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
                try {
                    ws = new WebSocket(WS_URL);
                    ws.onopen = function() {
                        reconnectAttempts = 0;
                        setWsStatus(true);
                        setStatus('Pobieram dane sieci...', 'info');
                        wsSend('carregarRede');
                        wsSend('status');
                        wsSend('carregarIdioma');
                    };
                    ws.onmessage = function(event) {
                        var msg = event.data;
                        if (msg.startsWith('idiomaAtual:')) return;
                        if (msg.startsWith('redeCarregada')) {
                            var parts = msg.split(':')[1].split(',');
                            var ssid = parts[0].split('=')[1] || '';
                            var pass = parts[1].split('=')[1] || '';
                            ssidInput.value = ssid;
                            passInput.value = pass;
                            setStatus('Wczytano zapisaną sieć', 'ok');
                        } else if (msg === 'rede:nenhumaRedeSalva') {
                            ssidInput.value = '';
                            passInput.value = '';
                            setStatus('Brak zapisanej sieci', 'info');
                        } else if (msg.startsWith('status:')) {
                            var statusText = msg.includes('conectado') ? 'Połączono' : 'Rozłączono';
                            wifiStatus.textContent = statusText;
                        } else if (msg === 'erro:dadosInvalidos') {
                            setStatus('Nieprawidłowe dane sieci', 'err');
                        }
                    };
                    ws.onclose = function() {
                        setWsStatus(false);
                        setStatus('Rozłączono, ponowna próba...', 'err');
                        scheduleReconnect();
                    };
                    ws.onerror = function(err) {
                        console.warn('WebSocket error:', err);
                        setStatus('Błąd WebSocket', 'err');
                        if (ws) ws.close();
                    };
                } catch (e) {
                    console.warn('WebSocket init error:', e);
                    setStatus('Nie można utworzyć połączenia', 'err');
                    scheduleReconnect();
                }
            }

            function scheduleReconnect() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts++;
                if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
                    setStatus('Brak połączenia – spróbuj ponownie ręcznie', 'err');
                    return;
                }
                const delay = Math.min(5000, 1000 * Math.pow(1.5, reconnectAttempts));
                reconnectTimer = setTimeout(wsConnect, delay);
            }

            function saveNetwork() {
                var ssid = ssidInput.value.trim();
                var pass = passInput.value.trim();
                if (ssid.length < 1 || pass.length < 8) {
                    setStatus('SSID i hasło (min. 8 znaków) są wymagane', 'err');
                    return;
                }
                var msg = 'salvarRede:ssid=' + ssid + ',senha=' + pass;
                if (wsSend(msg)) setStatus('Wysłano dane sieci', 'ok');
            }

            function removeNetwork() {
                if (!confirm('Usunąć zapisaną sieć Wi-Fi?')) return;
                if (wsSend('removerRede')) {
                    setStatus('Wysłano polecenie usunięcia', 'info');
                    ssidInput.value = '';
                    passInput.value = '';
                }
            }

            function goBack() { window.location.href = '/'; }

            function reconnectManually() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts = 0;
                if (ws) { try { ws.close(); } catch (e) {} }
                ws = null;
                setStatus('Łączenie...', 'info');
                wsConnect();
            }

            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('saveBtn').addEventListener('click', saveNetwork);
                document.getElementById('removeBtn').addEventListener('click', removeNetwork);
                document.getElementById('backBtn').addEventListener('click', goBack);
                wsStatus.addEventListener('click', reconnectManually);
                wsDot.addEventListener('click', reconnectManually);
                wsConnect();
                setInterval(function() {
                    if (!wsConnected) reconnectManually();
                }, 30000);
            });

            window.addEventListener('beforeunload', function() {
                if (ws) { try { ws.close(); } catch (e) {} }
                if (reconnectTimer) clearTimeout(reconnectTimer);
            });
        })();
    </script>

</body>
</html>
