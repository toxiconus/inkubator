<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustawienia · Spis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0c0e;
            font-family: 'Courier New', 'IBM Plex Mono', monospace;
            font-size: 16px;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .instrument {
            width: 100%;
            max-width: 640px;
            background: #0c0e12;
            border: 1px solid #1e2228;
            border-radius: 8px;
            padding: 18px 22px 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1e24;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #ccdce8;
            text-transform: uppercase;
        }
        .header-title span {
            color: #5a6a7a;
        }
        .header-status {
            font-size: 12px;
            color: #5a6a7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a3240;
            transition: background 0.4s ease;
        }
        .header-status .dot.online {
            background: #30c060;
            box-shadow: 0 0 10px rgba(48, 192, 96, 0.4);
        }
        .header-status .dot.offline {
            background: #e05050;
            box-shadow: 0 0 10px rgba(224, 80, 80, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .grid-item {
            display: block;
            padding: 14px 12px;
            background: rgba(20, 24, 32, 0.4);
            border: 1px solid #1a1e24;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            color: #8a9aa8;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .grid-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #3a4250;
            color: #b0c8d8;
        }
        .grid-item .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        .btn-back {
            display: block;
            margin-top: 16px;
            padding: 10px;
            border: 1px solid #1a1e24;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            color: #4a525a;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: #3a4250;
            color: #6a7a8a;
        }

        .status-bar {
            margin-top: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #5a6a7a;
            background: rgba(20, 24, 32, 0.4);
            border: 1px solid #1a1e24;
            min-height: 34px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-bar .msg {
            flex: 1;
        }
        .status-bar .msg.ok {
            color: #70d070;
        }
        .status-bar .msg.err {
            color: #e05050;
        }
        .status-bar .msg.info {
            color: #5a9a8a;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            .instrument {
                padding: 12px 14px;
            }
            .header-title {
                font-size: 14px;
            }
            .grid-item {
                font-size: 12px;
                padding: 12px 10px;
            }
        }
        @media (max-width: 400px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .instrument {
                padding: 8px 10px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <div class="header">
            <div class="header-title"><span>⚙</span> Ustawienia · <span id="pageTitle">Spis</span></div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <div class="grid">
            <a href="/temperatura" class="grid-item"><span class="icon">🌡️</span>Temperatura</a>
            <a href="/umidade" class="grid-item"><span class="icon">💧</span>Wilgotność</a>
            <a href="/virador" class="grid-item"><span class="icon">🔄</span>Obrót jaj</a>
            <a href="/incubacao" class="grid-item"><span class="icon">🐣</span>Inkubacja</a>
            <a href="/alarmes" class="grid-item"><span class="icon">🔔</span>Alarmy</a>
            <a href="/wifi" class="grid-item"><span class="icon">📶</span>Wi-Fi</a>
            <a href="/diversos" class="grid-item"><span class="icon">⚙</span>Różne</a>
            <a href="/console" class="grid-item"><span class="icon">⌨️</span>Konsola</a>
        </div>

        <a href="/" class="btn-back">← Wróć do panelu</a>

        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span style="font-size:10px;color:#2a3240;" id="wsDetail"></span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const WS_URL = 'ws://' + location.host + ':81/';
            let ws = null,
                wsConnected = false,
                reconnectTimer = null,
                reconnectAttempts = 0;
            const MAX_RECONNECT_ATTEMPTS = 10;

            const statusMsg = document.getElementById('statusMsg');
            const wsDot = document.getElementById('wsDot');
            const wsStatus = document.getElementById('wsStatus');
            const wsDetail = document.getElementById('wsDetail');

            function setStatus(text, type) {
                statusMsg.textContent = text;
                statusMsg.className = 'msg' + (type ? ' ' + type : '');
            }

            function setWsStatus(connected) {
                wsConnected = connected;
                wsDot.className = 'dot' + (connected ? ' online' : ' offline');
                wsStatus.textContent = connected ? 'Połączono' : 'Rozłączono';
                wsDetail.textContent = connected ? 'WebSocket OK' : 'próba ' + reconnectAttempts;
            }

            function wsConnect() {
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
                try {
                    ws = new WebSocket(WS_URL);
                    ws.onopen = function() {
                        reconnectAttempts = 0;
                        setWsStatus(true);
                        setStatus('Połączono', 'ok');
                        wsSend('carregarIdioma');
                    };
                    ws.onmessage = function(event) {
                        var msg = event.data;
                        if (msg.startsWith('idiomaAtual:')) {
                            // język – opcjonalnie
                        }
                    };
                    ws.onclose = function() {
                        setWsStatus(false);
                        setStatus('Rozłączono, ponowna próba...', 'err');
                        scheduleReconnect();
                    };
                    ws.onerror = function(err) {
                        console.warn('WebSocket error:', err);
                        setStatus('Błąd WebSocket', 'err');
                        if (ws) ws.close();
                    };
                } catch (e) {
                    console.warn('WebSocket init error:', e);
                    setStatus('Nie można utworzyć połączenia', 'err');
                    scheduleReconnect();
                }
            }

            function scheduleReconnect() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts++;
                if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
                    setStatus('Brak połączenia – spróbuj ponownie ręcznie', 'err');
                    return;
                }
                const delay = Math.min(5000, 1000 * Math.pow(1.5, reconnectAttempts));
                reconnectTimer = setTimeout(wsConnect, delay);
            }

            function wsSend(cmd) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(cmd);
                    return true;
                }
                return false;
            }

            function reconnectManually() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectAttempts = 0;
                if (ws) { try { ws.close(); } catch (e) {} }
                ws = null;
                setStatus('Łączenie...', 'info');
                wsConnect();
            }

            document.addEventListener('DOMContentLoaded', function() {
                wsStatus.addEventListener('click', reconnectManually);
                wsDot.addEventListener('click', reconnectManually);
                wsConnect();
                setInterval(function() {
                    if (!wsConnected) reconnectManually();
                }, 30000);
            });

            window.addEventListener('beforeunload', function() {
                if (ws) { try { ws.close(); } catch (e) {} }
                if (reconnectTimer) clearTimeout(reconnectTimer);
            });
        })();
    </script>

</body>
</html>
