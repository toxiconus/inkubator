<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    
    <meta name="description" content="Panel sterowania inkubatorem: konfiguracja, diagnostyka i monitoring." />
    <meta name="theme-color" content="#101317" />
<title>Ustawienia · Wi-Fi</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <noscript><div class="noscript-banner">Do poprawnego dzialania panelu wymagany jest JavaScript.</div></noscript>
    <div id="offlineBanner" class="offline-banner" role="status" aria-live="polite" aria-atomic="true"></div>

    <main class="instrument" id="mainContent" role="main">

        <!-- ===== NAGŁÓWEK ===== -->
        <div class="header">
            <div class="header-title">
                <span>⚙</span> Ustawienia · <span id="pageTitle">Wi-Fi</span>
            </div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <!-- ===== TREŚĆ ===== -->
        <form id="wifiForm" autocomplete="on">
        <div class="card" style="margin-bottom:12px;">
            <div class="card-header">
                <span class="card-title">📶 Konfiguracja sieci</span>
            </div>
            <div style="padding:4px 0;">

                <div class="form-group">
                    <label class="label" for="wifiSsid">Nazwa sieci (SSID)</label>
                    <div class="form-row">
                        <input type="text" id="wifiSsid" placeholder="Wpisz nazwę sieci" autocomplete="username" spellcheck="false" aria-label="Nazwa sieci Wi-Fi" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="label" for="wifiPass">Hasło <span class="unit">(min. 8 znaków)</span></label>
                    <div class="form-row">
                        <input type="password" id="wifiPass" placeholder="Wpisz hasło" autocomplete="current-password" aria-label="Hasło Wi-Fi" />
                    </div>
                </div>

                <!-- Status połączenia -->
                <div style="display:flex;justify-content:space-between;font-size:12px;color:#5a6a7a;padding:8px 0;border-top:1px solid #1a1e24;margin-top:4px;">
                    <span style="text-transform:uppercase;letter-spacing:0.06em;font-weight:600;">Status</span>
                    <span id="wifiStatus" style="color:#8a9aa8;font-weight:600;" role="status" aria-live="polite" aria-atomic="true">--</span>
                </div>

            </div>
        </div>

        <!-- ===== PRZYCISKI ===== -->
        <div class="btn-group">
            <button type="button" class="btn btn-primary" id="wifiSaveBtn">Zapisz</button>
            <button type="button" class="btn btn-danger" id="wifiRemoveBtn">Usuń</button>
            <button type="button" class="btn btn-secondary" id="wifiRefreshBtn">Odśwież</button>
        </div>

        <div class="btn-group" style="margin-top:6px;">
            <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
        </div>
        </form>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar" role="status" aria-live="polite" aria-atomic="true">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span class="ws-detail" id="wsDetail"></span>
        </div>

    </main>

    <!-- ===== SKRYPTY ===== -->
    <script src="ws-utils.js"></script>
<script src="js/common.js"></script>
    <script src="js/pages/wifi.js"></script>

</body>
</html>
