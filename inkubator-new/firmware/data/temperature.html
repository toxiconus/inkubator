<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustawienia · Temperatura</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        /* ===== STYLE SPECYFICZNE DLA TEMPERATURY ===== */
        .current-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(20, 24, 32, 0.4);
            border: 1px solid #1a1e24;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .current-value .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #5a6a7a;
            font-weight: 600;
        }

        .current-value .value {
            font-size: 18px;
            font-weight: 700;
            color: #f0f6fc;
        }

        .current-value .value.ok {
            color: #70d070;
        }

        .current-value .value.warn {
            color: #e8b830;
        }

        .current-value .value.err {
            color: #e05050;
        }

        .current-value .unit {
            font-size: 12px;
            color: #5a6a7a;
            font-weight: 400;
            margin-left: 2px;
        }

        .temp-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .temp-range {
                grid-template-columns: 1fr;
            }
            .current-value .value {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <!-- ===== NAGŁÓWEK ===== -->
        <div class="header">
            <div class="header-title">
                <span>⚙</span> Ustawienia · <span id="pageTitle">Temperatura</span>
            </div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <!-- ===== AKTUALNA WARTOŚĆ ===== -->
        <div class="current-value">
            <span class="label">🌡️ Aktualna temperatura</span>
            <span class="value" id="currentTemp">-- <span class="unit">°C</span></span>
        </div>

        <!-- ===== FORMULARZ ===== -->
        <form id="configForm" autocomplete="off">

            <!-- Setpoint -->
            <div class="form-group">
                <span class="label">Setpoint <span class="unit">(36.0 – 39.0 °C)</span></span>
                <div class="form-row">
                    <input type="number" id="setpoint" min="36.0" max="39.0" step="0.1" value="37.5" />
                    <span class="hint">°C</span>
                </div>
            </div>

            <!-- Histereza -->
            <div class="form-group">
                <span class="label">Histereza <span class="unit">(0.2 – 1.0 °C)</span></span>
                <div class="form-row">
                    <input type="number" id="hysteresis" min="0.2" max="1.0" step="0.1" value="0.5" />
                    <span class="hint">°C</span>
                </div>
            </div>

            <!-- Alarmy -->
            <div class="temp-range">
                <div class="form-group">
                    <span class="label">Alarm max <span class="unit">(38.0 – 40.0 °C)</span></span>
                    <div class="form-row">
                        <input type="number" id="alarmMax" min="38.0" max="40.0" step="0.1" value="40.0" />
                        <span class="hint">°C</span>
                    </div>
                </div>

                <div class="form-group">
                    <span class="label">Alarm min <span class="unit">(34.0 – 36.0 °C)</span></span>
                    <div class="form-row">
                        <input type="number" id="alarmMin" min="34.0" max="36.0" step="0.1" value="36.0" />
                        <span class="hint">°C</span>
                    </div>
                </div>
            </div>

            <!-- Kalibracja -->
            <div class="form-group">
                <span class="label">Kalibracja czujnika <span class="unit">(offset -5.0 – +5.0 °C)</span></span>
                <div class="form-row">
                    <input type="number" id="calibration" min="-5.0" max="5.0" step="0.1" value="0.0" />
                    <span class="hint">°C</span>
                </div>
            </div>

            <!-- Tryb sterowania -->
            <div class="form-group">
                <span class="label">Tryb sterowania</span>
                <div class="form-row">
                    <select id="controlMode">
                        <option value="0">On/Off</option>
                        <option value="1">PID</option>
                    </select>
                </div>
            </div>

            <!-- Opóźnienie wentylatora -->
            <div class="form-group">
                <span class="label">Opóźnienie wentylatora <span class="unit">(0 – 15 s)</span></span>
                <div class="form-row">
                    <input type="number" id="fanDelay" min="0" max="15" step="1" value="5" />
                    <span class="hint">sekund</span>
                </div>
            </div>

            <hr class="form-divider" />

            <!-- ===== PRZYCISKI ===== -->
            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="saveBtn">Zapisz</button>
                <button type="button" class="btn btn-secondary" id="clearMinMaxBtn">Resetuj min/max</button>
                <button type="button" class="btn btn-danger" id="resetBtn">Przywróć domyślne</button>
            </div>

            <div class="btn-group" style="margin-top:6px;">
                <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
            </div>

        </form>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span class="ws-detail" id="wsDetail"></span>
        </div>

    </div>

    <!-- ===== SKRYPTY ===== -->
    <script src="/js/common.js"></script>
    <script src="/js/pages/temperature.js"></script>

</body>
</html>
