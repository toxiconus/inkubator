<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustawienia · Alarmy</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        /* ===== STYLE SPECYFICZNE DLA ALARMÓW ===== */
        .alarm-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(26, 30, 36, 0.4);
        }

        .alarm-group label {
            font-size: 13px;
            color: #8a9aa8;
            cursor: pointer;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .alarm-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #5a8a7a;
            cursor: pointer;
            background: #161d24;
            border: 1px solid #2d3744;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .alarm-group input[type="checkbox"]:checked {
            accent-color: #70d070;
        }

        .alarm-group .alarm-id {
            font-size: 10px;
            color: #5a6a7a;
            margin-right: 8px;
            font-weight: 600;
            min-width: 24px;
        }

        .alarm-group .alarm-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .alarm-group .alarm-status.on {
            color: #70d070;
            background: rgba(48, 192, 96, 0.12);
            border: 1px solid rgba(48, 192, 96, 0.2);
        }

        .alarm-group .alarm-status.off {
            color: #5a6a7a;
            background: rgba(90, 106, 122, 0.12);
            border: 1px solid rgba(90, 106, 122, 0.2);
        }

        .alarm-group .alarm-status.active {
            color: #e05050;
            background: rgba(224, 80, 80, 0.12);
            border: 1px solid rgba(224, 80, 80, 0.2);
        }

        .alarm-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #5a6a7a;
            padding: 6px 4px 4px 4px;
            border-bottom: 1px solid #1a1e24;
            margin-bottom: 4px;
        }

        @media (max-width: 600px) {
            .alarm-group label {
                font-size: 11px;
            }
            .alarm-group input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <!-- ===== NAGŁÓWEK ===== -->
        <div class="header">
            <div class="header-title">
                <span>⚙</span> Ustawienia · <span id="pageTitle">Alarmy</span>
            </div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <!-- ===== TREŚĆ ===== -->
        <form id="configForm">

            <div class="alarm-section-title">🔴 Alarmy krytyczne</div>
            <div id="alarmList">
                <!-- Alarmy będą generowane przez JS -->
            </div>

            <div style="margin-top:10px;padding:8px 4px;background:rgba(20,24,32,0.3);border-radius:4px;border:1px solid #1a1e24;">
                <div style="display:flex;justify-content:space-between;font-size:11px;color:#5a6a7a;padding:2px 4px;">
                    <span>Status ogólny</span>
                    <span id="alarmOverallStatus" style="color:#70d070;font-weight:600;">OK</span>
                </div>
            </div>

            <!-- ===== PRZYCISKI ===== -->
            <div class="btn-group" style="margin-top:12px;">
                <button type="button" class="btn btn-primary" id="saveBtn">Zapisz alarmy</button>
                <button type="button" class="btn btn-secondary" id="refreshBtn">Odśwież</button>
            </div>

            <div class="btn-group" style="margin-top:6px;">
                <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
            </div>

        </form>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span class="ws-detail" id="wsDetail"></span>
        </div>

    </div>

    <!-- ===== SKRYPTY ===== -->
    <script src="/js/common.js"></script>
    <script src="/js/pages/alarms.js"></script>

</body>
</html>
