<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustawienia · Alarmy</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        /* ===== STYLE SPECYFICZNE DLA ALARMÓW ===== */
        .alarm-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(21, 23, 26, 0.4);
        }

        .alarm-group label {
            flex: 1;
            font-size: 13px;
            color: #aaa499;
            cursor: pointer;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* Przełącznik zamiast natywnego checkboxa (natywny ignoruje tło). */
        .alarm-group input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            width: 34px;
            height: 18px;
            border-radius: 999px;
            background: #343942;
            border: 1px solid #343942;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .alarm-group input[type="checkbox"]::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #aaa499;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .alarm-group input[type="checkbox"]:checked {
            background: rgba(143, 191, 143, 0.25);
            border-color: #8fbf8f;
        }

        .alarm-group input[type="checkbox"]:checked::before {
            transform: translateX(16px);
            background: #8fbf8f;
        }

        .alarm-group .alarm-id {
            font-size: 10px;
            color: #75706a;
            margin-right: 8px;
            font-weight: 600;
            min-width: 24px;
        }

        .alarm-group .alarm-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .alarm-group .alarm-status.on {
            color: #8fbf8f;
            background: rgba(143, 191, 143, 0.12);
            border: 1px solid rgba(143, 191, 143, 0.2);
        }

        .alarm-group .alarm-status.off {
            color: #75706a;
            background: rgba(117, 112, 106, 0.12);
            border: 1px solid rgba(117, 112, 106, 0.2);
        }

        .alarm-group .alarm-status.active {
            color: #e0786b;
            background: rgba(224, 120, 107, 0.12);
            border: 1px solid rgba(224, 120, 107, 0.2);
        }

        .alarm-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #75706a;
            padding: 6px 4px 4px 4px;
            border-bottom: 1px solid #262a30;
            margin-bottom: 4px;
        }

        @media (max-width: 600px) {
            .alarm-group label {
                font-size: 11px;
            }
            .alarm-group input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <!-- ===== NAGŁÓWEK ===== -->
        <div class="header">
            <div class="header-title">
                <span></span> Ustawienia · <span id="pageTitle">Alarmy</span>
            </div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <!-- ===== TREŚĆ ===== -->
        <form id="configForm">

            <div class="alarm-section-title">Alarmy krytyczne</div>
            <div id="alarmList">
                <!-- Alarmy będą generowane przez JS -->
            </div>

            <div style="margin-top:10px;padding:8px 4px;background:rgba(21,23,26,0.3);border-radius:4px;border:1px solid #262a30;">
                <div style="display:flex;justify-content:space-between;font-size:11px;color:#75706a;padding:2px 4px;">
                    <span>Status ogólny</span>
                    <span id="alarmOverallStatus" style="color:#8fbf8f;font-weight:600;">OK</span>
                </div>
            </div>

            <!-- ===== PRZYCISKI ===== -->
            <div class="btn-group" style="margin-top:12px;">
                <button type="button" class="btn btn-primary" id="saveBtn">Zapisz alarmy</button>
                <button type="button" class="btn btn-secondary" id="refreshBtn">Odśwież</button>
            </div>

            <div class="btn-group" style="margin-top:6px;">
                <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
            </div>

        </form>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span class="ws-detail" id="wsDetail"></span>
        </div>

    </div>

    <!-- ===== SKRYPTY ===== -->
    <script src="/js/common.js"></script>
    <script src="/js/pages/alarms.js"></script>

</body>
</html>
