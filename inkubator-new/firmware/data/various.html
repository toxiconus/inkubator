<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustawienia · Różne</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        /* ===== STYLE SPECYFICZNE DLA RÓŻNYCH ===== */
        .section {
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #75706a;
            margin-bottom: 6px;
            border-bottom: 1px solid #262a30;
            padding-bottom: 4px;
        }

        .info-line {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #75706a;
            padding: 4px 0;
        }

        .info-line .val {
            color: #aaa499;
            font-weight: 600;
        }

        .info-line .val.ok {
            color: #8fbf8f;
        }

        .info-line .val.err {
            color: #e0786b;
        }

        .info-line .val.warn {
            color: #e3a04a;
        }

        /* ===== OTA ===== */
        .ota-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ota-row input[type="file"] {
            flex: 1;
            min-width: 140px;
            background: #1b1e22;
            border: 1px solid #343942;
            border-radius: 4px;
            color: #ebe6dc;
            padding: 6px 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
        }

        .ota-row input[type="file"]::file-selector-button {
            background: #343942;
            border: none;
            color: #aaa499;
            padding: 4px 12px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            cursor: pointer;
        }

        .ota-row input[type="file"]::file-selector-button:hover {
            background: #3f4550;
        }

        .fw-version {
            font-size: 11px;
            color: #75706a;
            padding: 4px 0;
        }

        .fw-version .ver {
            color: #8fbf8f;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .ota-row {
                flex-direction: column;
                align-items: stretch;
            }
            .ota-row input[type="file"] {
                min-width: unset;
            }
        }
    </style>
</head>
<body>

    <div class="instrument">

        <!-- ===== NAGŁÓWEK ===== -->
        <div class="header">
            <div class="header-title">
                <span></span> Ustawienia · <span id="pageTitle">Różne</span>
            </div>
            <div class="header-status">
                <span class="dot" id="wsDot"></span>
                <span id="wsStatus">Łączenie...</span>
            </div>
        </div>

        <!-- ===== FORMULARZ ===== -->
        <form id="configForm">

            <!-- ===== ZEGAR / NTP ===== -->
            <div class="section">
                <div class="section-title">⏱ Zegar</div>
                <div class="info-line">
                    <span>Aktualny czas (RTC)</span>
                    <span class="val" id="rtcTime">--:-- --.--.----</span>
                </div>
                <div class="btn-group" style="margin-top:4px;">
                    <button type="button" class="btn btn-primary" id="ntpBtn">Synchronizuj NTP</button>
                    <button type="button" class="btn btn-secondary" id="rtcRefreshBtn">Odśwież</button>
                </div>
            </div>

            <!-- ===== JĘZYK ===== -->
            <div class="section">
                <div class="section-title">Język</div>
                <div class="form-group">
                    <span class="label">Wybierz język interfejsu</span>
                    <div class="form-row">
                        <select id="langSelect">
                            <option value="pl">Polski</option>
                            <option value="en">English</option>
                            <option value="pt">Português</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group" style="margin-top:4px;">
                    <button type="button" class="btn btn-primary" id="langBtn">Zapisz język</button>
                </div>
            </div>

            <!-- ===== OTA ===== -->
            <div class="section">
                <div class="section-title">Aktualizacja firmware (OTA)</div>
                <div class="form-group">
                    <span class="label">Wybierz plik .bin</span>
                    <div class="ota-row">
                        <input type="file" id="otaFile" accept=".bin" />
                        <button type="button" class="btn btn-primary" id="otaBtn">Wyślij i aktualizuj</button>
                    </div>
                </div>
                <div class="fw-version">
                    Wersja firmware: <span class="ver" id="fwVersion">--</span>
                </div>
                <div id="otaProgress" style="display:none;margin-top:4px;">
                    <div style="background:#1b1e22;border-radius:3px;height:6px;overflow:hidden;">
                        <div id="otaProgressBar" style="width:0%;height:100%;background:#b07a3e;transition:width 0.3s ease;"></div>
                    </div>
                    <span style="font-size:10px;color:#75706a;" id="otaProgressText">0%</span>
                </div>
            </div>

            <!-- ===== ZARZĄDZANIE ===== -->
            <div class="section">
                <div class="section-title">Zarządzanie</div>
                <div class="btn-group">
                    <button type="button" class="btn btn-danger" id="resetBtn">Przywróć fabryczne</button>
                    <button type="button" class="btn btn-danger" id="rebootBtn">Zrestartuj ESP</button>
                </div>
            </div>

            <!-- ===== PRZYCISK POWROTU ===== -->
            <div class="btn-group" style="margin-top:8px;">
                <button type="button" class="btn btn-back btn-full" id="backBtn">← Wróć do panelu</button>
            </div>

        </form>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <span class="msg" id="statusMsg">Gotowy</span>
            <span class="ws-detail" id="wsDetail"></span>
        </div>

    </div>

    <!-- ===== SKRYPTY ===== -->
    <script src="/js/common.js"></script>
    <script src="/js/pages/various.js"></script>

</body>
</html>
